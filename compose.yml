# moonie-redirect, deployed with plain Docker Compose (or as a Portainer stack) or with `just run`: compose builds the
# image from this repository. Values come from .env (see .env.example), the store key and the password from files.
# Settings (/admin/settings) set the password, API keys, the webhook and the Cloudflare token in the database, which
# wins over the files: the password, API token and Cloudflare token files are fallbacks.
#
# Two modes (D35). This file alone is LAN mode: the app answers in plain http on the host's port, with no reverse proxy
# and no network to create first. Behind a reverse proxy, lay compose.proxy.yml over it:
#   docker compose -f compose.yml -f compose.proxy.yml up -d --build      (or: just run-proxy)
name: moonie-redirect

services:
  moonie:
    # Built from this repository's Dockerfile, and tagged with this name, on the first `docker compose up`
    build: .
    image: ${MOONIE_REDIRECT_IMAGE:-moonie-redirect:local}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    environment:
      MOONIE_REDIRECT_PUBLIC_BASE_URL: ${MOONIE_REDIRECT_PUBLIC_BASE_URL:?set MOONIE_REDIRECT_PUBLIC_BASE_URL in .env}
      # The key the Cloudflare token and the webhook secret are sealed with, kept outside the data volume. Without the
      # store_key lines (this one, its entry below and its secret) the app draws store.key in the volume, which a backup
      # of the volume then holds too
      MOONIE_REDIRECT_STORE_KEY_FILE: /run/secrets/store_key
      MOONIE_REDIRECT_PASSWORD_FILE: /run/secrets/password
      MOONIE_REDIRECT_API_TOKEN_FILE: /run/secrets/api_token
      # Cloudflare (optional, else set the token in Settings): uncomment this line, the secret below and its entry
      # MOONIE_REDIRECT_CLOUDFLARE_TOKEN_FILE: /run/secrets/cloudflare_token
      TZ: ${TZ:-UTC}
    secrets:
      - store_key
      - password
      - api_token
      # - cloudflare_token
    volumes:
      - data:/data
    # LAN mode: the host's port, on every address of the host by default; 127.0.0.1 keeps it for a proxy on the host.
    # compose.proxy.yml drops it
    ports:
      - "${MOONIE_REDIRECT_BIND:-0.0.0.0}:${MOONIE_REDIRECT_PORT:-8080}:8080"

volumes:
  # The SQLite database, /data/redirect.db
  data: {}

# The files sit in ./secrets beside this file, or in the folder MOONIE_REDIRECT_SECRETS_DIR names (an absolute path on
# the host for a Portainer stack, which does not see this repository's relative paths)
secrets:
  # 64 hexadecimal characters (`openssl rand -hex 32 > secrets/store_key`), readable by uid 10001; back it up apart
  store_key:
    file: ${MOONIE_REDIRECT_SECRETS_DIR:-./secrets}/store_key
  # The admin password, on one line, readable by uid 10001 (the app's user); a password set in Settings wins over it
  password:
    file: ${MOONIE_REDIRECT_SECRETS_DIR:-./secrets}/password
  # A random token of 32 characters or more, readable by uid 10001: a key with every scope, beside those made in Settings
  api_token:
    file: ${MOONIE_REDIRECT_SECRETS_DIR:-./secrets}/api_token
  # Optional: a Cloudflare API token, readable by uid 10001. Left commented, as compose stops on a missing file
  # cloudflare_token:
  #   file: ${MOONIE_REDIRECT_SECRETS_DIR:-./secrets}/cloudflare_token
